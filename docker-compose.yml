services:
  api:
    build: .
    container_name: travel-planner-api
    restart: always
    ports: 
    - 8000:8000
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - DATABASE_URL=postgresql://postgres:1234567890@postgres_db:5432/travel_planner
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:16-alpine
    container_name: travel_planner_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234567890
      - POSTGRES_DB=travel_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: